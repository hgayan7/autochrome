[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autochrome"
version = "0.1.0"
description = "Autonomous photographic color science engine, MCP server, and live preview studio for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "mcp>=1.0.0",
    "pywebview>=5.0.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'"
]

[project.scripts]
autochrome = "autochrome.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autochrome*"]
